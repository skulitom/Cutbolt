[package]
name = "cutbolt"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "An original local video editing engine for agents"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.40.2", features = ["bundled", "blob"] }

schemars = "1.2.2"
png = "=0.18.1"
hound = "=3.5.1"
fontdue = { version = "=0.9.4", default-features = false, features = ["std"] }
harfrust = "=0.13.3"
unicode-bidi = "=0.3.18"
unicode-segmentation = "=1.13.3"
unicode-script = "=0.5.8"
unicode-linebreak = "=0.1.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "=0.62.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

# Content checks remain mandatory in development; optimize the selected hash
# implementation so verifying large external tools does not dominate previews.
[profile.dev.package.sha2]
opt-level = 3

# tools/impact.py builds coverage-instrumented engines with --cfg cutbolt_coverage.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(cutbolt_coverage)"] }
