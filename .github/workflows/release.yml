name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release, in the form vX.Y.Z'
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/publish-registry.yml
      - mcpb/**
      - server.json

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: cutbolt.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: cutbolt
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: cutbolt
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate release version (PRs use Cargo.toml for their dry run)
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { cargoVersion, readJSON, VERSION } from './mcpb/build.mjs';
          const version = await cargoVersion();
          const tag = process.env.DRY_RUN === 'true' ? `v${version}` : process.env.INPUT_TAG;
          if (!tag.startsWith('v') || !VERSION.test(tag.slice(1)) || tag !== `v${version}`) {
            throw new Error('Tag must be vX.Y.Z and match Cargo.toml.');
          }
          if (Object.hasOwn(await readJSON('server.json'), 'packages')) throw new Error('server.json must remain metadata-only.');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE
          if [[ "$DRY_RUN" != true ]]; then
            # Provenance records this run's own ref and commit, so a manual run must start from the tag itself.
            [[ "$GITHUB_REF" == "refs/tags/$INPUT_TAG" ]] || { echo "::error::Start this run from the tag: gh workflow run release.yml --ref $INPUT_TAG -f tag=$INPUT_TAG"; exit 1; }
            git show-ref --verify "refs/tags/$INPUT_TAG"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$INPUT_TAG^{commit}")"
          fi
      - name: Install the verified Rust toolchain and build
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          # Link the C runtime statically on Windows, so the download runs without the Visual C++ Redistributable.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          host=$(rustc +1.98.1 -vV | sed -n 's/^host: //p' | tr -d '\r')
          test "$host" = "$EXPECTED_TARGET" || { echo "::error::Runner host $host differs from $EXPECTED_TARGET"; exit 1; }
          cargo +1.98.1 build --release --locked
          if [[ "$RUNNER_OS" == Windows ]] && grep -qai 'vcruntime140' target/release/cutbolt.exe; then
            echo "::error::cutbolt.exe still imports the Visual C++ runtime"; exit 1
          fi
      - name: Run version, generate dependency notices and package the native CLI
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          RUSTUP_TOOLCHAIN: '1.98.1'
        run: |
          set -euo pipefail
          "./target/release/$BINARY" --version
          node mcpb/notices.mjs --target "$TARGET" --out target/THIRD_PARTY_NOTICES.md
          node mcpb/package.mjs "$TARGET" "target/release/$BINARY" target/dist/release --notices target/THIRD_PARTY_NOTICES.md
      - name: Build, smoke-test and validate the Windows MCPB
        if: runner.os == 'Windows'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          node mcpb/build.mjs --binary target/release/cutbolt.exe --notices target/THIRD_PARTY_NOTICES.md --out target/dist/release
          node mcpb/verify.mjs target/dist/release/cutbolt-windows-x64.mcpb
          node --test mcpb/mcpb.test.mjs mcpb/notices.test.mjs
          node --input-type=module <<'NODE'
          import { readFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import { readZip } from './mcpb/zip.mjs';
          mkdirSync('target/mcpb-validation', { recursive: true });
          writeFileSync('target/mcpb-validation/manifest.json', readZip(readFileSync('target/dist/release/cutbolt-windows-x64.mcpb')).get('manifest.json').read());
          NODE
          npx --yes @anthropic-ai/mcpb@2.1.2 validate target/mcpb-validation/manifest.json
          node mcpb/build.mjs --registry-entry --tag "$RELEASE_TAG" --bundle target/dist/release/cutbolt-windows-x64.mcpb --out target/dist/release/server.registry.json
      - name: Upload build output (including PR dry runs)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cutbolt-build-${{ matrix.target }}
          path: target/dist/release/*
          if-no-files-found: error
          overwrite: true # Replace only workflow artifacts on a job rerun, never release assets.

  release:
    if: github.repository == 'skulitom/Cutbolt' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cutbolt-build-*
          merge-multiple: true
          path: target/dist/release
      - name: Write checksums for every release asset
        shell: bash
        run: |
          set -euo pipefail
          cd target/dist/release
          sha256sum -- *.zip *.tar.gz *.mcpb *.mcpb.sha256 | sort -k2 > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Attest archives and bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/dist/release/*.zip
            target/dist/release/*.tar.gz
            target/dist/release/*.mcpb
      - name: Save bundle, checksum and registry entry for maintainer testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cutbolt-mcpb
          path: |
            target/dist/release/cutbolt-windows-x64.mcpb
            target/dist/release/cutbolt-windows-x64.mcpb.sha256
            target/dist/release/server.registry.json
          if-no-files-found: error
          overwrite: true
      - name: Publish GitHub release without replacing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          highest=$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1)
          latest=false
          if [[ "$RELEASE_TAG" == "$highest" ]]; then latest=true; fi
          assets=(target/dist/release/*.zip target/dist/release/*.tar.gz target/dist/release/*.mcpb target/dist/release/*.mcpb.sha256 target/dist/release/SHA256SUMS)
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets,isDraft > target/dist/existing-release.json; then
            mkdir -p target/dist/existing
            missing=()
            # Compare every existing asset before uploading anything; never use --clobber.
            for file in "${assets[@]}"; do
              asset=$(basename "$file")
              if jq -e --arg name "$asset" '.assets | any(.name == $name)' target/dist/existing-release.json > /dev/null; then
                gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p "$asset" -D target/dist/existing
                expected=$(sha256sum "$file" | cut -d ' ' -f 1)
                actual=$(sha256sum "target/dist/existing/$asset" | cut -d ' ' -f 1)
                if [[ "$actual" != "$expected" ]]; then
                  echo "::error::Release asset $asset has different bytes; refusing to replace it."
                  exit 1
                fi
                echo "Identical release asset $asset; skipped."
              else
                missing+=("$file")
              fi
            done
            if (( ${#missing[@]} )); then gh release upload "$RELEASE_TAG" "${missing[@]}" -R "$GITHUB_REPOSITORY"; fi
            # A draft (left by an interrupted run, or made by hand) isn't public: publish it once every asset matches.
            if jq -e '.isDraft' target/dist/existing-release.json > /dev/null; then
              gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --draft=false "--latest=$latest"
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "Cutbolt $RELEASE_TAG" --notes-file mcpb/RELEASE_NOTES.md --generate-notes "--latest=$latest"
          fi
          printf 'Release %s: native archives, Windows MCPB and checksums attached. Test the download before dispatching Publish to MCP Registry.\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
